# Builds the launcher installer, with the builder pack bundled, and publishes it as a GitHub release.
# The installer contains no game code: every user's runtime is compiled on their machine from their own disc.
#
#   Release:  git tag v0.1.0 && git push origin v0.1.0
#   Test run: Actions > Release > Run workflow (uploads the installer as a workflow artifact only)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  NWIIRECOMP_COMMIT: 595f176f1d24cc54ff2e8389feed12d7fb553cc2
  WINLIBS_URL: https://github.com/brechtsanders/winlibs_mingw/releases/download/16.1.0posix-14.0.0-ucrt-r2/winlibs-x86_64-posix-seh-gcc-16.1.0-mingw-w64ucrt-14.0.0-r2.zip
  WINLIBS_SHA256: 78eff1e2e804b6a6320c713f084b8f820c662104a24cea6a3bfcab82032bdd60

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check builder inputs
        run: python tools/builder_revision.py

      - name: Fetch NWiiRecomp at the pinned revision
        run: |
          git clone https://github.com/BlackLineInteractive/NWiiRecomp.git vendor/NWiiRecomp
          git -C vendor/NWiiRecomp checkout --detach $env:NWIIRECOMP_COMMIT

      - name: Fetch the MinGW-w64 toolchain
        run: |
          Invoke-WebRequest $env:WINLIBS_URL -OutFile "$env:RUNNER_TEMP\winlibs.zip"
          $hash = (Get-FileHash "$env:RUNNER_TEMP\winlibs.zip" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:WINLIBS_SHA256) { throw "WinLibs archive hash $hash does not match the pin" }
          Expand-Archive "$env:RUNNER_TEMP\winlibs.zip" -DestinationPath "$env:RUNNER_TEMP\winlibs"

      - name: Assemble the builder pack
        run: python tools/make_builder_pack.py --mingw "$env:RUNNER_TEMP\winlibs\mingw64"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Test the launcher
        working-directory: launcher/src-tauri
        run: cargo test --release --lib

      - name: Build the installer
        working-directory: launcher/src-tauri
        run: cargo tauri build --config tauri.bundle.conf.json

      - name: Collect the installer
        id: collect
        run: |
          $setup = Get-ChildItem launcher/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $name = "CrashLauncher-$((Get-Content launcher/src-tauri/tauri.conf.json | ConvertFrom-Json).version)-windows-x64-setup.exe"
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item $setup.FullName "dist/$name"
          Get-ChildItem dist/*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      # The installer extracts the builder pack (~900 MB) into %LOCALAPPDATA%. A single unreadable path aborts it (one release
      # stopped on SDL's Android project), so install it silently here, check the pack, and only then publish anything.
      - name: Install the built installer and verify the builder pack
        shell: pwsh
        run: |
          $product = (Get-Content launcher/src-tauri/tauri.conf.json | ConvertFrom-Json).productName
          $setup = Get-ChildItem dist/*.exe | Select-Object -First 1
          Write-Host "Installing $($setup.Name) silently"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA $product
          $need = @(
            'builder-pack/native-builder/builder-revision.json',
            'builder-pack/native-builder/tools/build_native.py',
            'builder-pack/native-builder/tools/fix_direct_texcoord_loader.py',
            'builder-pack/native-builder/runtime-overlays/native_texture_memo.h',
            'builder-pack/deps/sdl2-src/CMakeLists.txt',
            'builder-pack/deps/sdl2-src/src/SDL.c',
            'builder-pack/deps/tomlplusplus-src/CMakeLists.txt',
            'builder-pack/deps/glad-src/CMakeLists.txt',
            'builder-pack/toolchain/mingw64/bin/g++.exe',
            'builder-pack/toolchain/python/python.exe'
          )
          $missing = @($need | Where-Object { -not (Test-Path -LiteralPath (Join-Path $dir $_)) })
          if ($missing.Count) { throw "installed pack is incomplete: $($missing -join ', ')" }
          $pruned = @('builder-pack/deps/sdl2-src/android-project', 'builder-pack/deps/sdl2-src/Xcode', 'builder-pack/deps/sdl2-src/VisualC')
          $kept = @($pruned | Where-Object { Test-Path -LiteralPath (Join-Path $dir $_) })
          if ($kept.Count) { throw "pruned trees are still installed: $($kept -join ', ')" }
          $have = (Get-Content (Join-Path $dir 'builder-pack/native-builder/builder-revision.json') | ConvertFrom-Json).revision
          $want = [regex]::Match((Get-Content tools/builder_revision.py -Raw), "REVISION='([^']+)'").Groups[1].Value
          if ($have -ne $want) { throw "pack revision $have does not match $want" }
          $bin = Join-Path $dir 'builder-pack/toolchain/mingw64/bin'
          $env:PATH = "$bin;$env:PATH"
          $gcc = Join-Path $bin 'gcc.exe'
          & (Join-Path $bin 'cmake.exe') -S (Join-Path $dir 'builder-pack/deps/sdl2-src') -B (Join-Path $env:RUNNER_TEMP 'sdl-configure') `
            -G Ninja -DCMAKE_C_COMPILER=$gcc -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST_LIBRARY=OFF | Write-Host
          if ($LASTEXITCODE -ne 0) { throw 'the pruned SDL2 source no longer configures with the bundled toolchain' }
          $stats = Get-ChildItem $dir -Recurse -File | Measure-Object -Property Length -Sum
          Write-Host ("installed {0:N0} MB in {1} files" -f ($stats.Sum / 1MB), $stats.Count)
          if (Test-Path (Join-Path $dir 'uninstall.exe')) { Start-Process (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait }

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # A tag with a hyphen (v0.2.0-rc1) is a pre-release; v0.1.1 is stable and becomes "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
