# Builds the launcher installer, with the builder pack bundled, and publishes it as a GitHub release.
# The installer contains no game code: every user's runtime is compiled on their machine from their own disc.
#
#   Release:  git tag v0.1.0 && git push origin v0.1.0
#   Test run: Actions > Release > Run workflow (uploads the installer as a workflow artifact only)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  NWIIRECOMP_COMMIT: 595f176f1d24cc54ff2e8389feed12d7fb553cc2
  WINLIBS_URL: https://github.com/brechtsanders/winlibs_mingw/releases/download/16.1.0posix-14.0.0-ucrt-r2/winlibs-x86_64-posix-seh-gcc-16.1.0-mingw-w64ucrt-14.0.0-r2.zip
  WINLIBS_SHA256: 78eff1e2e804b6a6320c713f084b8f820c662104a24cea6a3bfcab82032bdd60

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check builder inputs
        run: python tools/builder_revision.py

      - name: Fetch NWiiRecomp at the pinned revision
        run: |
          git clone https://github.com/BlackLineInteractive/NWiiRecomp.git vendor/NWiiRecomp
          git -C vendor/NWiiRecomp checkout --detach $env:NWIIRECOMP_COMMIT

      - name: Fetch the MinGW-w64 toolchain
        run: |
          Invoke-WebRequest $env:WINLIBS_URL -OutFile "$env:RUNNER_TEMP\winlibs.zip"
          $hash = (Get-FileHash "$env:RUNNER_TEMP\winlibs.zip" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:WINLIBS_SHA256) { throw "WinLibs archive hash $hash does not match the pin" }
          Expand-Archive "$env:RUNNER_TEMP\winlibs.zip" -DestinationPath "$env:RUNNER_TEMP\winlibs"

      - name: Assemble the builder pack
        run: python tools/make_builder_pack.py --mingw "$env:RUNNER_TEMP\winlibs\mingw64"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Test the launcher
        working-directory: launcher/src-tauri
        run: cargo test --release --lib

      - name: Build the installer
        working-directory: launcher/src-tauri
        run: cargo tauri build --config tauri.bundle.conf.json

      - name: Collect the installer
        id: collect
        run: |
          $setup = Get-ChildItem launcher/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $name = "CrashLauncher-$((Get-Content launcher/src-tauri/tauri.conf.json | ConvertFrom-Json).version)-windows-x64-setup.exe"
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item $setup.FullName "dist/$name"
          Get-ChildItem dist/*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: true
          generate_release_notes: true
